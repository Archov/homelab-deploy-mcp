# Copy this file to config.yaml (already gitignored) and fill in your own
# homelab details. Never commit the real config.yaml — it names your host,
# your SSH user, and the path to your private key.

ssh:
  host: "192.168.1.50" # your homelab server's IP or hostname
  port: 22
  # Each agent gets its own Unix account (homelab-deploy-<agent>) and its
  # own key — homelab-deploy itself is only ever a group, never an
  # account you can SSH in as. Set these two to the account/key
  # belonging to THIS config's agent; see the README's "Setup" and
  # "Adding an agent" sections.
  user: "homelab-deploy-claude" # must match that agent's Unix account
  key_path: "~/.ssh/homelab_deploy_claude_ed25519"
  # Pin the host key so a changed/spoofed host key is refused rather than
  # silently trusted. Get this from the homelab server itself, not from the
  # client, and verify it out-of-band (e.g. by running this over a
  # connection you already trust, like a console session):
  #   ssh-keygen -lf /etc/ssh/ssh_host_ed25519_key.pub -E sha256
  host_key_fingerprint: "SHA256:REPLACE_ME"
  connect_timeout_seconds: 15
  command_timeout_seconds: 600 # docker builds can take a while
  # Path to the forced-command entrypoint on the homelab host (see
  # deploy/redeploy.sh). Shared across every target below — there's only
  # ever one of these per host, regardless of how many targets you add.
  remote_script: "/opt/deploy/redeploy.sh"

# A mapping of target name -> allowlist, one entry per project you want
# deployable (not a YAML list/sequence — the loader rejects one). This
# mapping is a client-side mirror for fast, clear rejection — the real
# allowlist that actually gets enforced lives on the homelab host, inside
# deploy/deploy-executor.sh. Keep the two in sync by hand; see that
# script's own comments.
targets:
  mediaclipmakarr:
    allowed_branches:
      - main
      - feature/make-clip-moc-update
      # A glob pattern, not just an exact name: matches any branch under
      # this prefix (e.g. codex/my-feature), which is handy for an agent
      # that creates its own branches on the fly rather than working off
      # a fixed, known set. Only branches matter here, not env files --
      # env_file entries below stay exact-match names always.
      - "codex/*"
    allowed_env_files:
      - prod.env
      - staging.env
  # otherproject:
  #   allowed_branches:
  #     - main
  #   allowed_env_files:
  #     - prod.env
