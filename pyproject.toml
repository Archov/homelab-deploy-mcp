[project]
name = "homelab-deploy-mcp"
version = "0.1.0"
description = "A narrow, whitelisted MCP server for redeploying homelab docker compose stacks over SSH."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "mcp>=2.0.0",
  "paramiko>=3.4",
  "pyyaml>=6.0",
]

[project.scripts]
homelab-deploy-mcp = "homelab_deploy_mcp.server:main"
homelab-deploy-init = "homelab_deploy_mcp.config_wizard:main"
homelab-deploy-add-target = "homelab_deploy_mcp.target_wizard:main"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/homelab_deploy_mcp"]
