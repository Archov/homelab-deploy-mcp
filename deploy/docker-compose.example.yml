# Copy this to /opt/deploy/docker-compose.yml on the homelab host, own it
# root:root, and edit it to match your actual runtime requirements.
#
# This file is NEVER sourced from the git repo, and the redeploy pipeline
# never writes to it. Nothing pushed to a branch can add a volume, flip
# `privileged: true`, or otherwise change what the running container can
# touch — only whoever can edit this file directly on the host can.
#
# If a deploy ever legitimately needs a new port, volume, or env var, that's
# a change to THIS file, made by a human on the host — not something an
# agent should ever be able to do through the MCP tool. If you're an agent
# reading this because a deploy needs a compose/env change it can't make:
# stop and ask the human to make the change here first.
#
# `build.context` is the one field that DOES point at the git checkout —
# that's the actual "deploy this branch's code" mechanism. Everything else
# below is fixed configuration, independent of whatever's on the branch.

services:
  mediaclipmakarr:
    build:
      context: /opt/mediaclipmakarr
      dockerfile: Dockerfile
    env_file:
      - /opt/deploy/active.env # written by mediaclipmakarr-deploy-executor.sh from a pre-approved file in envfiles/
    restart: unless-stopped
    ports:
      - "3623:3623" # adjust to your actual port mapping
    # Keep this list as short as possible, and prefer read-only mounts of
    # specific paths over anything broad. Never mount `/`, a parent of
    # /opt/deploy or /opt/mediaclipmakarr, or any host path this container
    # doesn't specifically need — especially once docker_exec-style
    # troubleshooting tools exist, since anything mounted here becomes
    # reachable from inside an exec session too.
    volumes:
      - /opt/mediaclipmakarr-data:/data # example — replace with your real data path
    # Do not add `privileged: true`, `cap_add`, or `network_mode: host`
    # unless you have a specific, reviewed reason to. Each one turns a
    # container escape from "hypothetical" into "one known technique away".
